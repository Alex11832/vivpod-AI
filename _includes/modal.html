<div class="modal" data-modal id="demo-modal" role="dialog" aria-modal="true" aria-labelledby="demo-modal-title">
  <div class="modal-dialog">
    <button class="modal-close" data-modal-close aria-label="Close demo form">?</button>
    <h3 id="demo-modal-title">Book a demo</h3>
    <p>See Vivpod schedule, capture, and transfer calls in action.</p>
    <form action="mailto:hello@vivpod.com" method="POST" enctype="text/plain">
      <label>
        Name
        <input type="text" name="Name" required />
      </label>
      <label>
        Email
        <input type="email" name="Email" required />
      </label>
      <label>
        Company
        <input type="text" name="Company" />
      </label>
      <label>
        Message
        <textarea name="Message" rows="4" placeholder="Preferred demo time"></textarea>
      </label>
      <button type="submit" class="btn btn-primary">Send demo request</button>
    </form>
  </div>
</div>
