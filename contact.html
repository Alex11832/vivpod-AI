meta_description: Contact Vivpod to book a demo, ask about integrations, or talk pricing.

<section class="section">
  <h1>Contact</h1>
  <p>Tell us about your business and we will prepare a demo with your team in minutes.</p>
  <form class="contact-form" action="mailto:hello@vivpod.com" method="POST" enctype="text/plain">
    <label>
      Name
      <input type="text" name="Name" required />
    </label>
    <label>
      Email
      <input type="email" name="Email" required />
    </label>
    <label>
      Company
      <input type="text" name="Company" />
    </label>
    <label>
      Message
      <textarea name="Message" rows="4" placeholder="Briefly describe your team"></textarea>
    </label>
    <button type="submit" class="btn btn-primary">Send message</button>
  </form>
</section>
