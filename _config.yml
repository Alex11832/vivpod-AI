# Site settings
title: "ViVpod - AI Voice Agent That Never Misses a Call"
description: "24/7 AI receptionist and dispatcher for businesses. Never miss a call, capture every lead, book appointments automatically."
url: "https://vivpod.com"
baseurl: ""

# Contact
email: contact@vivpod.com
phone: "+1 (555) 123-4567"

# Social
twitter_username: vivpod
linkedin_username: vivpod

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  industries:
    output: true
    permalink: /industries/:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - design-notes.md

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "industries"
    values:
      layout: "industry"
