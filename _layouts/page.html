---
layout: default
---

<div class="section">
  <div class="container">
    <article>
      {% if page.title %}
      <header class="section-header">
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <p class="section-description">{{ page.description }}</p>
        {% endif %}
      </header>
      {% endif %}
      
      <div class="page-content">
        {{ content }}
      </div>
    </article>
  </div>
</div>
