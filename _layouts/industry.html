---
layout: default
---

<!-- Industry Hero -->
<section class="hero" style="padding: var(--spacing-lg) 0;">
  <div class="container">
    <div class="hero-content">
      <h1>{{ page.title }}</h1>
      <p class="hero-subtitle">{{ page.description }}</p>
      <div class="hero-cta">
        <a href="#" class="btn btn-primary btn-large" data-modal="demo">Get a Demo</a>
        <a href="{{ '/pricing' | relative_url }}" class="btn btn-secondary btn-large">See Pricing</a>
      </div>
    </div>
  </div>
</section>

<!-- Content -->
<div class="section">
  <div class="container">
    {{ content }}
  </div>
</div>

<!-- CTA Banner -->
<section class="cta-banner">
  <div class="container">
    <h2>Ready to Get Started?</h2>
    <p>Join hundreds of {{ page.industry_name }} businesses using ViVpod.</p>
    <a href="#" class="btn btn-secondary btn-large" data-modal="demo">Book Your Demo</a>
  </div>
</section>
