---
layout: default
---

<div class="section">
  <div class="container">
    <article style="max-width: 800px; margin: 0 auto;">
      <header class="section-header">
        <h1>{{ page.title }}</h1>
        <p style="color: var(--gray); font-size: 1rem;">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
          {% if page.author %} • By {{ page.author }}{% endif %}
        </p>
      </header>
      
      <div class="page-content" style="font-size: 1.125rem; line-height: 1.8;">
        {{ content }}
      </div>
      
      <footer style="margin-top: var(--spacing-lg); padding-top: var(--spacing-md); border-top: 1px solid var(--gray-light);">
        <div class="cta-banner" style="border-radius: var(--radius-lg); padding: var(--spacing-lg);">
          <h3>Ready to Transform Your Business?</h3>
          <p>See how ViVpod can help you never miss a call again.</p>
          <a href="#" class="btn btn-secondary btn-large" data-modal="demo">Get a Demo</a>
        </div>
      </footer>
    </article>
  </div>
</div>
