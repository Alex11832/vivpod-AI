---
layout: page
title: Blog
meta_description: Updates and stories from Vivpod on AI voice dispatch, compliance, and integrations.
---
<section class="section">
  <h1>Blog</h1>
  <div class="feature-grid">
    {% for post in site.posts %}
      <article class="card">
        <p class="post-meta">{{ post.date | date: "%b %d, %Y" }}</p>
        <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
        <p>{{ post.excerpt }}</p>
      </article>
    {% endfor %}
  </div>
</section>
